# Готовий whisper-cli з Vulkan для Windows — щоб Whisper ішов на відеокартах AMD та Intel.
#
# whisper.cpp випускає під Windows збірки лише для процесора й NVIDIA (CUDA),
# тож Vulkan-збірку робимо тут: один самодостатній whisper-cli.exe (статично,
# CRT і шейдери Vulkan усередині), без сторонніх DLL. vulkan-1.dll ставиться
# разом із драйвером відеокарти, тож на машині покупця вже є.
# Запуск: Actions → «whisper-cli for Windows (Vulkan)» → Run workflow. Результат —
# реліз цього репозиторію із zip і його SHA-256 у підсумку запуску.
# Репозиторій має бути ПУБЛІЧНИМ: панелі покупців качають файли без входу.
# URL і SHA-256 потім вписуються в src/ui/tabs/captions.js (NS.downloads.whisperVulkan).

name: whisper-cli for Windows (Vulkan)

on:
  workflow_dispatch:
    inputs:
      whisper_ref:
        description: 'Тег whisper.cpp — той самий, що в Windows-збірці панелі'
        default: 'b5130'
        required: true
      vulkan_sdk:
        description: 'Версія Vulkan SDK від LunarG (потрібна лише для збірки)'
        default: '1.4.357.0'
        required: true

# Збірка виконує чужий код (whisper.cpp, інсталятор SDK) — їй лише читання;
# писати в релізи може тільки останній крок
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - name: Source
        run: |
          git clone --depth 1 --branch "${{ inputs.whisper_ref }}" https://github.com/ggml-org/whisper.cpp src
          Add-Content $env:GITHUB_STEP_SUMMARY "- whisper.cpp ${{ inputs.whisper_ref }}: commit $(git -C src rev-parse HEAD)"

      - name: Vulkan SDK
        run: |
          $ver = '${{ inputs.vulkan_sdk }}'
          curl.exe -fsSL -o "$env:RUNNER_TEMP\vulkan-sdk.exe" "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Vulkan SDK ${ver}: sha256 $((Get-FileHash "$env:RUNNER_TEMP\vulkan-sdk.exe" -Algorithm SHA256).Hash.ToLower())"
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\vulkan-sdk.exe" -ArgumentList '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          if (-not (Test-Path "C:\VulkanSDK\$ver\Bin\glslc.exe")) { Write-Output "::error::Vulkan SDK is not installed"; exit 1 }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$ver"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$ver\Bin"

      - name: Build
        run: |
          # /MT замість /MD: без VC++ Redistributable на машині покупця.
          # OpenMP вимкнено: MSVC дає його лише як vcomp140.dll, у ggml є свій пул потоків.
          # AVX2 — Haswell (2013) і новіші: усі процесори, на яких іде AE 2022+
          cmake -S src -B build -A x64 `
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DBUILD_SHARED_LIBS=OFF `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON `
            -DGGML_OPENMP=OFF `
            -DGGML_VULKAN=ON `
            -DWHISPER_BUILD_TESTS=OFF `
            -DWHISPER_BUILD_SERVER=OFF `
            -DWHISPER_SDL2=OFF
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build --config Release --target whisper-cli -j 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Check and package
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory out, check | Out-Null
          Copy-Item build\bin\Release\whisper-cli.exe out\
          Copy-Item src\LICENSE out\LICENSE.txt

          # Лише системні DLL і vulkan-1.dll (її ставить драйвер відеокарти):
          # інакше на машині покупця програма не запуститься
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          $deps = & $dumpbin /nologo /dependents out\whisper-cli.exe | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim() }
          Write-Output "Depends on: $($deps -join ', ')"
          if (-not ($deps -contains 'vulkan-1.dll')) { Write-Output "::error::whisper-cli is built without Vulkan"; exit 1 }
          foreach ($d in $deps) {
            if ($d -eq 'vulkan-1.dll' -or $d -like 'api-ms-win-core-*') { continue }
            if ($d -match '^(vcruntime|msvcp|vcomp|concrt|ucrtbase|api-ms-win-crt)' -or -not (Test-Path "$env:SystemRoot\System32\$d")) {
              Write-Output "::error::whisper-cli links a non-system library: $d"; exit 1
            }
          }

          # Запускається взагалі. На раннері немає відеокарти, а vulkan-1.dll може
          # не бути — для перевірки беремо її з SDK (у zip вона не йде)
          Copy-Item out\whisper-cli.exe check\
          if (-not (Test-Path "$env:SystemRoot\System32\vulkan-1.dll")) {
            $loader = Get-ChildItem $env:VULKAN_SDK -Recurse -Filter vulkan-1.dll | Select-Object -First 1
            if ($loader) { Copy-Item $loader.FullName check\ } else { Write-Output "::warning::no vulkan-1.dll on the runner" }
          }
          # Вивід у stderr — не помилка кроку
          $ErrorActionPreference = 'Continue'
          & check\whisper-cli.exe -h *> $null
          Write-Output "whisper-cli -h exit code: $LASTEXITCODE"
          if ($LASTEXITCODE -lt 0 -or $LASTEXITCODE -gt 255) { Write-Output "::error::whisper-cli does not start"; exit 1 }

          # Справжня транскрипція з DTW, як у панелі (без відеокарти — на процесорі)
          curl.exe -fsSL -o check\base.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/5359861c739e955e79d9a303bcbc70fb988958b1/ggml-base-q8_0.bin"
          & check\whisper-cli.exe -m check\base.bin -f src\samples\jfk.wav -l en -t 4 -of check\jfk -np -ojf -dtw base -nfa 2>&1 | Select-Object -Last 15
          $ErrorActionPreference = 'Stop'
          $text = (Get-Content check\jfk.json -Raw | ConvertFrom-Json).transcription.text -join ''
          Write-Output "Text: $text"
          if ($text -notmatch 'ask not what your country') { Write-Output "::error::transcription does not match"; exit 1 }

          $zip = 'whisper-cli-win-vulkan-x64.zip'
          7z a -tzip -mx=9 $zip .\out\* | Out-Null
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item $zip).Length
          Add-Content $env:GITHUB_STEP_SUMMARY "### win32-x64 (Vulkan)`n- file: $zip`n- sha256: ``$sha```n- bytes: $size`n- depends on: $($deps -join ', ')"

      - uses: actions/upload-artifact@v4
        with:
          name: whisper-cli-win-vulkan-x64
          path: whisper-cli-win-vulkan-x64.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: whisper-vulkan-${{ inputs.whisper_ref }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "whisper-cli for Windows with Vulkan (${{ inputs.whisper_ref }})" \
              --notes "Static whisper-cli.exe of whisper.cpp ${{ inputs.whisper_ref }} with Vulkan (AMD and Intel graphics), for the Steven panel."
          # Без --clobber: панелі покупців звіряють SHA-256 саме цього файлу, і
          # підмінений повторним запуском zip зламав би їм завантаження. Нова збірка — новий тег
          gh release upload "$TAG" whisper-cli-win-vulkan-*.zip --repo "$GITHUB_REPOSITORY"
          {
            echo "### Release $TAG"
            for f in whisper-cli-win-vulkan-*.zip; do
              echo "- https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$f"
              echo "  sha256 \`$(sha256sum "$f" | cut -d' ' -f1)\`, bytes $(stat -c%s "$f")"
            done
          } >> "$GITHUB_STEP_SUMMARY"
